# Название workflow в GitHub → Actions
name: Android CI

# Ручной запуск CI из интерфейса GitHub
on:
  workflow_dispatch:
    inputs:

      # Выпадающий список для выбора типа сборки
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

      # Checkbox: запускать unit-тесты или нет
      run_tests:
        description: 'Run unit tests'
        required: true
        default: true
        type: boolean

# Workflow имеет только право читать код репозитория
permissions:
  contents: read

jobs:
  build:
    # GitHub создаёт временный Linux runner
    runs-on: ubuntu-latest

    # Эти переменные увидит Gradle через System.getenv(...)
    # Пароли и alias берём из GitHub Secrets
    env:
      KEYSTORE_PATH: keystore/android-modern-cheatsheet.jks
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      # Получаем код commit, для которого запущен workflow
      - name: Checkout repository
        uses: actions/checkout@v7

      # Устанавливаем JDK для Gradle/Android Gradle Plugin
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # Настраиваем Gradle и кеш зависимостей
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # На Linux gradlew должен иметь право на выполнение
      - name: Make Gradle Wrapper executable
        run: chmod +x gradlew

      # Восстанавливаем .jks из GitHub Secret.
      # Файл существует только внутри временного runner.
      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 --decode > keystore/android-modern-cheatsheet.jks
          chmod 600 keystore/android-modern-cheatsheet.jks

      # Выполняется только если разработчик включил Run unit tests
      - name: Run unit tests
        if: ${{ inputs.run_tests }}
        run: ./gradlew testDebugUnitTest

      # Собираем выбранный разработчиком вариант.
      # И debug, и release используют appSigning из app/build.gradle.kts.
      - name: Build Debug
        if: ${{ inputs.build_type == 'debug' }}
        run: ./gradlew assembleDebug

      - name: Build Release
        if: ${{ inputs.build_type == 'release' }}
        run: ./gradlew assembleRelease

      # Загружаем APK непосредственно как файл, без ZIP.
      - name: Upload Debug APK
        if: ${{ inputs.build_type == 'debug' }}
        uses: actions/upload-artifact@v7
        with:
          path: app/build/outputs/apk/debug/app-debug.apk
          archive: false
          if-no-files-found: error

      - name: Upload Release APK
        if: ${{ inputs.build_type == 'release' }}
        uses: actions/upload-artifact@v7
        with:
          path: app/build/outputs/apk/release/app-release.apk
          archive: false
          if-no-files-found: error