# Название workflow в GitHub → Actions
name: Android CI

# Ручной запуск CI из интерфейса GitHub
on:
  workflow_dispatch:
    inputs:

      # Выпадающий список для выбора типа сборки
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

      # Checkbox: запускать unit-тесты или нет
      run_tests:
        description: 'Run unit tests'
        required: true
        default: true
        type: boolean

# Workflow имеет только право читать код репозитория
permissions:
  contents: read

jobs:
  build:
    # GitHub создаёт временный Linux runner
    runs-on: ubuntu-latest

    steps:
      # Получаем код commit, для которого запущен workflow
      - name: Checkout repository
        uses: actions/checkout@v7

      # Устанавливаем JDK для Gradle/Android Gradle Plugin
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # Настраиваем Gradle и кеш зависимостей
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # На Linux gradlew должен иметь право на выполнение
      - name: Make Gradle Wrapper executable
        run: chmod +x gradlew

      # Выполняется только если разработчик включил Run unit tests
      - name: Run unit tests
        if: ${{ inputs.run_tests }}
        run: ./gradlew testDebugUnitTest

      # Собираем выбранный разработчиком вариант
      - name: Build Debug
        if: ${{ inputs.build_type == 'debug' }}
        run: ./gradlew assembleDebug

      - name: Build Release
        if: ${{ inputs.build_type == 'release' }}
        run: ./gradlew assembleRelease