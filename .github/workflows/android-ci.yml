# Название workflow в GitHub → Actions
name: Android CI

# Ручной запуск из интерфейса GitHub
# + автоматический запуск после изменений в master
on:
  workflow_dispatch:
    inputs:

      # Выпадающий список для выбора типа сборки
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

      # Checkbox: запускать unit-тесты или нет
      run_tests:
        description: 'Run unit tests'
        required: true
        default: true
        type: boolean

      # Что необходимо проверить тестировщику
      test_description:
        description: 'What should be tested?'
        required: true
        type: string

  # После merge/push в master workflow запускается автоматически
  push:
    branches:
      - master

# Workflow имеет только право читать код репозитория
permissions:
  contents: read

jobs:
  build:
    # GitHub создаёт временный Linux runner
    runs-on: ubuntu-latest

    # Переменные окружения для подписи APK.
    # Gradle читает их через System.getenv(...),
    # секретные значения хранятся в GitHub Secrets.
    env:
      KEYSTORE_PATH: keystore/android-modern-cheatsheet.jks
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      # При ручном запуске берём выбранный build type.
      # При автоматическом push в master всегда собираем release.
      BUILD_TYPE: ${{ github.event_name == 'workflow_dispatch' && inputs.build_type || 'release' }}

      # При push в master тесты запускаются всегда.
      # При ручном запуске учитываем checkbox.
      RUN_TESTS: ${{ github.event_name == 'push' || inputs.run_tests }}

      # При ручном запуске используем текст разработчика.
      # При автоматическом запуске используем commit message.
      TEST_DESCRIPTION: ${{ github.event_name == 'workflow_dispatch' && inputs.test_description || github.event.head_commit.message }}

    steps:
      # Получаем код commit, для которого запущен workflow
      - name: Checkout repository
        uses: actions/checkout@v7

      # Устанавливаем JDK для Gradle/Android Gradle Plugin
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # Настраиваем Gradle и кеш зависимостей
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # На Linux gradlew должен иметь право на выполнение
      - name: Make Gradle Wrapper executable
        run: chmod +x gradlew

      # Восстанавливаем .jks из GitHub Secret.
      # Файл существует только внутри временного runner.
      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 --decode > keystore/android-modern-cheatsheet.jks
          chmod 600 keystore/android-modern-cheatsheet.jks

      # Unit-тесты для debug
      - name: Run Debug unit tests
        if: ${{ env.RUN_TESTS == 'true' && env.BUILD_TYPE == 'debug' }}
        run: ./gradlew testDebugUnitTest

      # Unit-тесты для release
      - name: Run Release unit tests
        if: ${{ env.RUN_TESTS == 'true' && env.BUILD_TYPE == 'release' }}
        run: ./gradlew testReleaseUnitTest

      # Собираем debug
      - name: Build Debug
        if: ${{ env.BUILD_TYPE == 'debug' }}
        run: ./gradlew assembleDebug

      # Собираем release
      - name: Build Release
        if: ${{ env.BUILD_TYPE == 'release' }}
        run: ./gradlew assembleRelease

      # Читаем versionName из app/build.gradle.kts
      - name: Read app version
        id: app_version
        run: |
          VERSION_NAME=$(grep 'versionName =' app/build.gradle.kts | head -1 | sed -E 's/.*versionName = "([^"]+)".*/\1/')
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      # Загружаем debug APK
      - name: Upload Debug APK
        id: upload_debug_apk
        if: ${{ env.BUILD_TYPE == 'debug' }}
        uses: actions/upload-artifact@v7
        with:
          path: app/build/outputs/apk/debug/app-debug.apk
          archive: false
          if-no-files-found: error

      # Summary для debug
      - name: Add Debug APK link to summary
        if: ${{ env.BUILD_TYPE == 'debug' }}
        run: |
          echo "## APK" >> "$GITHUB_STEP_SUMMARY"
          echo "**Build:** Debug" >> "$GITHUB_STEP_SUMMARY"
          echo "**Version:** ${{ steps.app_version.outputs.version_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Build number:** #${{ github.run_number }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "[Download app-debug.apk](${{ steps.upload_debug_apk.outputs.artifact-url }})" >> "$GITHUB_STEP_SUMMARY"

      # Загружаем release APK
      - name: Upload Release APK
        id: upload_release_apk
        if: ${{ env.BUILD_TYPE == 'release' }}
        uses: actions/upload-artifact@v7
        with:
          path: app/build/outputs/apk/release/app-release.apk
          archive: false
          if-no-files-found: error

      # Summary для release
      - name: Add Release APK link to summary
        if: ${{ env.BUILD_TYPE == 'release' }}
        run: |
          echo "## APK" >> "$GITHUB_STEP_SUMMARY"
          echo "**Build:** Release" >> "$GITHUB_STEP_SUMMARY"
          echo "**Version:** ${{ steps.app_version.outputs.version_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Build number:** #${{ github.run_number }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "[Download app-release.apk](${{ steps.upload_release_apk.outputs.artifact-url }})" >> "$GITHUB_STEP_SUMMARY"

      # Отправляем debug APK в Telegram
      - name: Send Debug APK to Telegram
        if: ${{ env.BUILD_TYPE == 'debug' }}
        run: |
          CAPTION=$(printf 'AndroidModernCheatsheet\n\nBuild: Debug\nVersion: %s\nBuild number: #%s\n\nЧто тестировать:\n%s' \
            "${{ steps.app_version.outputs.version_name }}" \
            "${{ github.run_number }}" \
            "$TEST_DESCRIPTION")

          curl -f \
            -F chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -F document=@app/build/outputs/apk/debug/app-debug.apk \
            -F caption="$CAPTION" \
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument"

      # Отправляем release APK в Telegram
      - name: Send Release APK to Telegram
        if: ${{ env.BUILD_TYPE == 'release' }}
        run: |
          CAPTION=$(printf 'AndroidModernCheatsheet\n\nBuild: Release\nVersion: %s\nBuild number: #%s\n\nЧто тестировать:\n%s' \
            "${{ steps.app_version.outputs.version_name }}" \
            "${{ github.run_number }}" \
            "$TEST_DESCRIPTION")

          curl -f \
            -F chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -F document=@app/build/outputs/apk/release/app-release.apk \
            -F caption="$CAPTION" \
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument"